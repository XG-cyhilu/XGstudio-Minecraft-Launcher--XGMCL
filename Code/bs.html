<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>:(</title>
<script src="./XGMCL/data/lib/qrcode.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #007ad7;
        color: #ffffff;
        font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
        user-select: none;
        cursor: none;
    }
    body {
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 12vh 0 0 14vw;
        position: relative;
        transition: background 0.4s ease;
    }
    body.stage-black {
        background: #000000;
    }
    body.stage-trick {
        background: #000000;
        align-items: center;
        justify-content: center;
        padding: 0;
    }
    .bsod-content {
        max-width: 80vw;
        opacity: 1;
        transition: opacity 0.4s ease;
    }
    body.stage-black .bsod-content,
    body.stage-trick .bsod-content {
        opacity: 0;
        pointer-events: none;
    }
    .face {
        font-size: 11vh;
        font-weight: 100;
        line-height: 1;
        margin-bottom: 5vh;
        letter-spacing: 0.5vw;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }
    .main-text {
        font-size: 3.2vh;
        line-height: 1.7;
        margin-bottom: 4vh;
        font-weight: 400;
    }
    .progress-line {
        font-size: 3vh;
        line-height: 1.6;
        margin-bottom: 5vh;
        font-weight: 400;
    }
    .bottom {
        display: flex;
        align-items: flex-start;
        gap: 3vw;
        font-size: 1.9vh;
        line-height: 1.7;
        color: #ffffff;
        margin-top: 2vh;
        max-width: 75vw;
    }
    #qr {
        width: 12vh;
        height: 12vh;
        flex-shrink: 0;
        background: #ffffff;
        border-radius: 2px;
        display: block;
    }
    .info {
        flex: 1;
        min-width: 0;
    }
    .info .line {
        margin-bottom: 1vh;
        word-break: break-all;
    }
    .info .url {
        color: #ffffff;
        text-decoration: underline;
    }
    .trick-text {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-family: 'Microsoft YaHei', sans-serif;
        font-size: 12vh;
        font-weight: bold;
        letter-spacing: 1.5vh;
        opacity: 0;
        transition: opacity 3s ease;
        pointer-events: none;
    }
    body.stage-trick .trick-text {
        opacity: 1;
    }
</style>
</head>
<body>
    <div class="bsod-content">
        <div class="face">:(</div>

        <div class="main-text">
            你的电脑遇到问题，需要重新启动。<br>
            我们只收集某些错误信息，然后为你重新启动。
        </div>

        <div class="progress-line">
            <span id="pct">0</span>% 完成
        </div>

        <div class="bottom">
            <canvas id="qr"></canvas>
            <div class="info">
                <div class="line">有关此问题的详细信息和可能的解决方法，请访问 https://www.windows.com/stopcode</div>
                <div class="line" style="margin-top: 1.5vh;">如果致电支持人员，请向他们提供以下信息：</div>
                <div class="line">终止代码：UNEXPECTED_KERNEL_MODE_TRAP</div>
            </div>
        </div>
    </div>
    <div class="trick-text" id="trickText">你被骗了!!!</div>
<script>
    const pctEl = document.getElementById("pct");
    let pct = 0;
    function setPct(v) {
        pct = v;
        pctEl.innerText = String(v);
    }
    function tick() {
        let step = 0;
        if (pct < 30) {
            if (Math.random() < 0.30) step = 7;
        } else if (pct < 68) {
            if (Math.random() < 0.05) step = 26;
        } else if (pct < 88) {
            if (Math.random() < 0.80) step = (Math.random() < 0.5 ? 1 : 2);
        } else if (pct < 98) {
            if (Math.random() < 0.20) {
                setPct(99);
                scheduleWaitAt99();
                return;
            }
        } else if (pct === 99) {
            return;
        }
        if (step > 0) {
            let next = pct + step;
            if (next > 99) next = 99;
            setPct(next);
            if (next === 99) {
                scheduleWaitAt99();
                return;
            }
        }
        setTimeout(tick, 1000);
    }
    let _wait99Started = false;
    function scheduleWaitAt99() {
        if (_wait99Started) return;
        _wait99Started = true;
        setTimeout(() => {
            setPct(100);
            setTimeout(startBlackStage, 1000);
        }, 12000);
    }
    function startBlackStage() {
        document.body.classList.add("stage-black");
        setTimeout(() => {
            document.body.classList.add("stage-trick");
            setTimeout(() => {
                if (window.bsAPI && window.bsAPI.finish) {
                    window.bsAPI.finish();
                }
            }, 3000 + 3000);
        }, 5000);
    }
    (function initQR() {
        const canvas = document.getElementById("qr");
        if (!canvas) return;
        if (typeof QRCode === "undefined") {
            console.warn("[bsod] qrcode.min.js 未加载");
            return;
        }
        console.log("[bsod] QRCode 已加载:", typeof QRCode, "toCanvas:", typeof QRCode.toCanvas);
        QRCode.toCanvas(canvas, "https://www.windows.com/stopcode", {
            width: 240,
            margin: 1,
            color: { dark: "#000000", light: "#ffffff" },
        }, function (err) {
            if (err) {
                console.error("[bsod] QR 生成失败:", err);
            } else {
                console.log("[bsod] QR 生成成功");
            }
        });
    })();
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" || e.key === "Esc") {
            e.preventDefault();
            if (window.bsAPI && window.bsAPI.prepareClose) {
                window.bsAPI.prepareClose();
            }
            if (window.bsAPI && window.bsAPI.forceClose) {
                window.bsAPI.forceClose();
            }
        }
    });
    setTimeout(tick, 1000);
</script>
</body>
</html>
